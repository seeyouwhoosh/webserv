server {
    listen  localhost:8888;
    server_name tester.com;
    cgi .bla var/www/YoupiBanane/cgi_tester;

    location / {
        root var/www/YoupiBanane;
        methods GET;
    }

    location /post_body {
        client_max_body_size 100;
        root var/www/html;
        methods POST;
        upload_store var/www/YoupiBanane/uploads;
    }

    location /directory {
        root var/www/YoupiBanane;
        methods GET;
        index youpi.bad_extension;
    }
}
