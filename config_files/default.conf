client_max_body_size	"5M";
timeout					5s;
cgi_timeout				10s;

server
{
	listen      8000;
	server_name	default.com;

	root		var/www/html;
	index		index.html;

	error_page	404 404.html;
	error_page	500 500.html;
	{}
	{}
	{}
	location	/
	{
		autoindex		on;
		limit_except	GET POST;
		index			"index.html";
		upload_store	"var/www/html/uploads";
	}

	location /cgi-bin
	{
		alias			var/www/cgi-bin;
		cgi				.py /opt/pyenv/shims/python3;
		cgi				.sh /usr/bin/bash;
		cgi				.php /usr/bin/php;
	}

	location /uploads 
	{
		autoindex		on;
		upload_store	var/www/html/uploads;
	}

	location	/todelete {
		limit_except	GET DELETE;
		index			index.png;
	}
	
	location	/new.html {
		return 301	/old.html;
	}
}