server {
    listen localhost:7777;
    server_name example.com;
    client_max_body_size 10M;

    error_page 404 var/www/html/errors/404.html;

    location / {
        root var/www/html;
        methods GET POST;
        index index.html;
        cgi .py /usr/bin/python3;
        autoindex on;
    }

    location /api {
        root var/www/html;
        methods POST;
        # cgi moved
        upload_store var/www/html/uploads;
    }

    location /old {
        return 301 /new;
    }
}

server {
    listen 0.0.0.0:7778;
    
    location / {
        root var/www/html;
        methods GET;
    }
}
