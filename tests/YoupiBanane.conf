server {
	listen 8080;
	server_name localhost;

	# "/" only accepts GET
	location / {
		root www;
		methods GET;
	}

	# Any .bla file is handled by CGI on POST
	location *.bla {
		methods POST;
		cgi .bla ./cgi_test;
	}

	# "/post_body" accepts POST with a maximum body size of 100 bytes
	location /post_body {
		methods POST;
		client_max_body_size 100;
	}

	# "/directory/" serves files from YoupiBanane
	# If no filename is given, look for youpi.bad_extension
	location /directory/ {
		root YoupiBanane;
		methods GET;
		index youpi.bad_extension;
	}
}