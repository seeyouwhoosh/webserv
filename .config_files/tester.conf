server {
    listen 7777;
    host 127.0.0.1;
    server_name websesv-example.com;
    client_body_size 10;

    error_page 404 var/www/html/errors/404.html;

    location / {
        root var/www/html;
        methods GET POST;
        index index.html;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
        autoindex on;
    }

    location /post_body {
        root var/www/html;
        methods POST;
        upload_dir var/www/html/uploads;
    }

    location ~.bla {
        methods POST;
        cgi ./cgi_test;
    }

    location /directory {
        root YoupiBanane;
        methods GET;
        index youpi.bad_extension;
        autoindex on;
    }
}

server {
    listen 7770;
    server_name websesv-example0.com;

    host 0.0.0.0;
    
    location / {
        root var/www/html;
        index index.html;
        methods GET;
    }
}

server {
    listen 7772;
    host 127.0.0.2;
    server_name websesv-example2.com;
    
    location / {
        root var/www/html;
        index index.html;
        methods GET;
    }
}